name: tests

# The suite runs entirely against mock_epic.py on localhost. Nothing here
# touches a real health system, and no client id, token, or record data
# belongs in this workflow — the logs are public.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Both platforms matter: lock_down() and the test's permission check each
    # have a Windows branch and a POSIX branch, and any single machine only
    # ever exercises one of them. 3.11 is the floor the README claims.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q epic_export.py mock_epic.py test_flow.py

      - name: End-to-end suite against the mock Epic
        run: python test_flow.py
